function feeInfo(q,V){const t=0.07*q*(1-q)*V,m=0.01*q*(1-q)*V;document.getElementById("ovb").innerHTML=`<h2 style="margin:0 0 10px">Fees</h2><div class="rules">Fee per share = <b>rate × p × (1 − p) × V</b>, where p is the Up price as a probability and V is the value of a pair (1 USDC + 1 IMD, now ≈ $${V.toFixed(2)}). The fee is highest at 50% and almost zero near 1% or 99%.<br><br><b>Taker</b> (your order fills at once): rate 7%. Now ≈ <b>$${t.toFixed(4)}</b> per share.<br><b>Maker</b> (your limit order waits in the book): rate 1%, now ≈ <b>$${m.toFixed(4)}</b>, and you <b>get 25% of the taker's fee</b> back as a rebate.<br><br>Where it goes: 25% of the taker fee to the maker, the rest to the pIMD treasury.<br>Up pays fees in USDC, Down in IMD.<br>Free: cancel, expiry, split, merge, claim.<br>Paying Down with IMD only: the missing USDC is swapped in the main IMD pool (pool fees 1% + 0.05% on the swapped part).</div><button class="trade" onclick="document.getElementById('ov').style.display='none'">Got it</button> <a class="small" style="display:block;text-align:center;margin-top:8px" href="#/docs/fees" onclick="document.getElementById('ov').style.display='none'">All the details →</a>`;document.getElementById("ov").style.display="block"}
function docs(t){side(null);const T=[["basics","Basics"],["trading","Trading"],["fees","Fees"],["results","Price and results"],["token","$pIMD token"]];
 const V=1+(S.live||2.45),ex=(q)=>`$${(0.07*q*(1-q)*V).toFixed(4)}`;
 const B={
 basics:`<p>pIMD is a market on one question: <b>will IMD be higher or lower at the end of the period than at the start?</b> Periods: 1 hour, 1 day, 1 week, 1 month. Every period starts at a round time in UTC (17:00, midnight, Monday, the 1st).</p>
 <h3>Up and Down shares</h3><ul><li><b>Up</b> wins if the price at the end is above the price to beat (the price at the start).</li><li><b>Down</b> wins if it is below.</li><li>Exactly equal: everyone gets their stake back.</li></ul>
 <h3>Price ladders</h3><p>Besides Up/Down there are lines like <b>"IMD above $3 at the end of November?"</b>. Each line is its own Yes/No market with the same book, fees and payout. Yes trades like Up, No like Down.</p>
 <h3>What a winning share pays</h3><p>Every pair of 1 Up + 1 Down is backed by <b>1 USDC + 1 IMD</b> locked in the contract. A winning share takes both: <b>1 USDC + 1 IMD</b>. A losing share pays nothing.</p>
 <h3>The price is the probability</h3><p>If Up costs 0.30 of a pair, the market thinks there is a 30% chance it goes up. Low % = few believe = bigger payout. You can sell any time before the end.</p>
 <div class="box"><b>Example.</b> IMD ≈ $${(S.live||2.45).toFixed(2)}, so a pair is worth ≈ $${V.toFixed(2)}. You buy 10 Up at 30% for ≈ $${(3*V).toFixed(2)}. If IMD ends higher you get 10 USDC + 10 IMD ≈ $${(10*V).toFixed(2)}.</div>`,
 trading:`<h3>One book, two sides</h3><p>There is one order book per market. <b>Buying Up = selling Down</b>, <b>buying Down = selling Up</b>. Up is paid in <b>USDC</b>, Down is paid in <b>IMD</b>.</p>
 <h3>Where the money for a pair comes from</h3><p>When a buyer of Up meets a buyer of Down, the contract creates a new pair: the Up buyer brings USDC, the Down buyer brings 1 IMD and covers the rest of the 1 USDC. If they pay with IMD only, the contract swaps the needed USDC in the main IMD pool in the same transaction, never spending more than their max IMD. If the swap falls short, the whole trade is cancelled, nothing is lost but gas.</p>
 <h3>Orders</h3><ul><li><b>Market</b>: fills now at the best prices in the book.</li><li><b>Limit</b>: your price. It fills at once if someone already offers it, otherwise it waits in the book. First come, first filled at the same price.</li><li>Choose an <b>expiry</b> or keep it until the market ends. Not filled = money back to your balance. Cancel any time, free.</li><li>Any amount: shares are fractional.</li></ul>
 <h3>Balance</h3><p>Deposit USDC and IMD, withdraw free funds any time. <b>Split</b>: 1 USDC + 1 IMD into 1 Up + 1 Down. <b>Merge</b>: 1 Up + 1 Down back to 1 USDC + 1 IMD. Both free, any time before the end.</p>`,
 fees:`<p>Fee per share = <b>rate × p × (1 − p) × V</b>. p = Up price as a probability, V = value of a pair (1 USDC + 1 IMD). Same formula as Polymarket: the fee is highest at 50% and almost zero near the edges.</p>
 <table><tr><th>Who</th><th>Rate</th><th>At 50%</th><th>At 10%</th></tr><tr><td><b>Taker</b> (fills at once)</td><td>7%</td><td>${ex(.5)}</td><td>${ex(.1)}</td></tr><tr><td><b>Maker</b> (order waits in the book)</td><td>1%</td><td>$${(0.01*.25*V).toFixed(4)}</td><td>$${(0.01*.09*V).toFixed(4)}</td></tr></table>
 <h3>Where it goes</h3><ul><li><b>25% of the taker fee</b> goes to the maker at once (rebate). Makers usually earn more than they pay.</li><li>The rest of the taker fee and the maker fee go to the <b>pIMD treasury</b>.</li><li>Up side pays fees in USDC, Down side in IMD.</li></ul>
 <h3>Free</h3><p>Cancel, expiry, split, merge, deposit, withdraw, claim.</p>
 <h3>Swap cost</h3><p>Only when you pay Down with IMD only: the missing USDC is bought in the main IMD pool, pool fees 1% + 0.05% on that part. The site shows it before you sign. Pay with your own USDC and there is no swap.</p>`,
 results:`<h3>Price to beat and the result</h3><p>The price is taken <b>exactly at the boundary</b> (for example 17:00:00 UTC) from the Uniswap v4 pools on Ethereum: IMD/ETH (the main IMD pool) × ETH/USDC. Median of 3 blocks, so one block can't move it.</p>
 <h3>Proven on Ethereum, no admin</h3><p>The site attaches a cryptographic proof of the pool state at that block to the first order or the claim. The contract checks it against Ethereum's own block history. Nobody, including the dev, can set or change a price.</p>
 <h3>If nobody proves it in 27 hours</h3><p>Anyone can propose the price with a <b>10 IMD bond</b>. For 1 hour anyone can dispute it with the same bond. No dispute: the price stands and the bond comes back. Dispute: the IdentityMD oracle (5 agents, 4 must agree) decides, the loser's bond pays the oracle and the rest goes to the winner. Still no price 3 days after the end: the market is void and everyone gets their stake back.</p>
 <h3>Claim</h3><p>After the end, winning shares are claimed to your balance: 1 USDC + 1 IMD each.</p>`,
 token:`<p><b>$pIMD</b> is the token of the project. 1,000,000,000 tokens, minted once on Ethereum, no more ever. Plain transfers: no transfer tax, no limits, no pause.</p>
 <div class="box tk">${pie()}<div class="lg"><div><i style="background:#6b7280"></i><b>50%</b> burned at launch</div><div><i style="background:#2d6cf6"></i><b>35%</b> liquidity pool pIMD/IMD</div><div><i style="background:#1f8f52"></i><b>10%</b> IMD AI agents (the swarm that built pIMD)</div><div><i style="background:#f5a524"></i><b>5%</b> dev</div></div></div>
 <h3>Burn</h3><p>Half the supply is sent to the dead address <b>0x000…dEaD</b> right after launch. Nobody has its key, so these tokens are gone forever. Anyone can check it on Etherscan.</p>
 <h3>Pool</h3><p>35% opens a Uniswap v4 pool paired with IMD. Every trade of $pIMD pays 1.25%: 1% to the pIMD treasury, 0.25% to IMD.</p>
 <h3>What holders do</h3><p><b>pIMD holders vote for the next listings and modifications</b>: new IMD ecosystem assets ($pIMD, $YOLO, $FWA, $INFER, $IMDSTR, $HIVE, $OG), new periods. Voting by token balance on Snapshot.</p>`};

  if(!need.length)return toast(S.bs==="BUY"?"No sellers at this price, nothing will fill":"No buyers at this price, nothing will fill");
  // a market order crosses the book, not the chart odds: walk the opposite side until the size is covered
  const lv=[...need].sort((a,b)=>S.bs==="BUY"?a[0]-b[0]:b[0]-a[0]);let left=S.sh,px=lv[0][0];for(const [p,q] of lv){px=p;left-=q;if(left<=0)break}
  price=px}
 act(api.order({C:{k:S.cm.k,a:S.cm.a,b:S.cm.b},side:up?"UP":"DOWN",bs:S.bs,type:S.ot,price:mkt?price*(S.bs==="BUY"?1.02:.98):price,shares:S.sh,expiry:S.exp||"never",imdOnly:false}))}
function tradeLad(k,K,yes,pu){if(api.demo)return act(api.order({}));if(!addr())return connectW();const C=mk(k,0);
 act(api.order({C:{k,a:C.a,b:C.b,K},side:yes?"UP":"DOWN",bs:"BUY",type:"Market",price:(yes?pu:pu/(S.live||1))*1.02,shares:S.sh,expiry:"never",imdOnly:false}))}
function claimMarket(){const C=S.cm;act(api.claim({k:C.k,a:C.a,b:C.b}))}
// chain: a normal market whose start price can no longer be recorded is frozen by the contract (it will void)
function frozen(C){if(api.demo||C.st==="next")return false;const r=api.boundary(C.a);return!!(r&&!r.recorded&&r.priceable===false)}
// ---- oracle fallback (chain only): no proof in 27 h -> propose with a 10 IMD bond, 1 h to dispute
function fallbackBox(C){if(api.demo)return"";const r=api.boundary(C.b);if(!r||r.recorded)return"";const p=r.proposal,age=Date.now()-C.b;
 if(p)return `<div class="res n" style="font-weight:500;font-size:13px">Proposed close ${usdf(p.price)} by ${WALLET.short(p.by)}. ${p.disputed?"Disputed: the IdentityMD oracle decides.":Date.now()<p.deadline?`Dispute until ${hm(p.deadline)} UTC with a 10 IMD bond. <button class="sb" style="background:var(--dn);color:#fff;margin-left:6px" onclick="act(api.dispute(${C.b}))">Dispute</button>`:p.finished?"The price is final.":`No dispute: the price stands. <button class="sb" style="background:var(--blue);color:#fff;margin-left:6px" onclick="act(api.finalize(${C.b}))">Finalize</button>`}</div>`;
 if(age>27*36e5)return `<div class="res n" style="font-weight:500;font-size:13px">No price proof in 27 hours. Anyone can propose the close price with a 10 IMD bond. <button class="sb" style="background:var(--blue);color:#fff;margin-left:6px" onclick="propM(${C.b})">Propose price</button></div>`;
 return `<div class="res n" style="font-weight:500;font-size:13px">The close price is proven on Ethereum with the first claim.</div>`}
function propM(T){const e=S.bp[T];document.getElementById("ovb").innerHTML=`<h2 style="margin:0 0 10px">Propose the price</h2><div class="rules">IMD price at <b>${hm(T)} UTC, ${day(T)}</b>, median of 3 blocks. You lock a <b>10 IMD bond</b> from your balance. Anyone can dispute within 1 hour; then the IdentityMD oracle decides and the loser's bond pays it.</div>
 <div class="fr"><span class="lb">Price, $</span><div class="stp"><input id="pamt" style="width:130px" inputmode="decimal" value="${e?e.p.toFixed(6):""}"></div></div>
 <button class="trade" onclick="const v=+document.getElementById('pamt').value;if(v>0){closeOv();act(api.proposePrice(${T},v))}">Propose with 10 IMD bond</button>`;document.getElementById("ov").style.display="block"}
function splitM(m,n){n=n==null?10:n;const v=V(),sp=m==="split";document.getElementById("ovb").innerHTML=`<div class="dk"><div class="tabs3" style="margin:0 0 12px">${["split","merge"].map(x=>`<a class="${x===m?"on":""}" href="javascript:splitM('${x}',${n})">${x==="split"?"Split":"Merge"}</a>`).join("")}</div></div>
 <div class="rules">${sp?"Turn <b>USDC + IMD</b> into <b>Up + Down</b> shares, 1 USDC + 1 IMD = 1 Up + 1 Down. Keep the side you like and sell the other one, or place both in the book as a market maker.":"Turn <b>Up + Down</b> back into <b>USDC + IMD</b>, 1 Up + 1 Down = 1 USDC + 1 IMD. Any time before the market ends."}</div>
 <div class="fr" style="margin-top:14px"><span class="lb">Amount</span><div class="stp"><input id="spn" style="width:110px" value="${n}" onchange="const x=Math.max(0,+this.value);setTimeout(()=>{if(Date.now()-PDOWN>=500)splitM('${m}',x)},50)"></div></div>
 <div class="tot"><div class="r"><span>You give</span><b>${sp?`${n} USDC + ${n} IMD`:`${n} Up + ${n} Down`}</b></div><div class="r"><span>You get</span><b class="g">${sp?`${n} Up + ${n} Down`:`${n} USDC + ${n} IMD`}</b></div><div class="r small"><span>Value</span><span>≈ ${m2(n*v)}</span></div><div class="r small"><span>Fee</span><span>none</span></div></div>
 <button class="trade" onclick="const x=Math.max(0,+document.getElementById('spn').value);closeOv();act(api['${m}'](S.cm||mk('1H',0),x))">${sp?"Split":"Merge"}</button><div class="small" style="text-align:center;margin-top:8px">${api.demo?"Demo · nothing is sent":"Free · you sign in your wallet"}</div>`;document.getElementById("ov").style.display="block"}
function ladK(k){const p=S.live||2.4,r=x=>+x.toPrecision(3);if(k==="1M")return[1,1.5,2,2.5,3,3.5,4,5,7];const o={"1H":[-3,-2,-1,0,1,2,3],"1D":[-10,-5,-2,0,2,5,10],"1W":[-20,-10,-5,0,5,10,20]}[k];return[...new Set(o.map(x=>r(p*(1+x/100))))].sort((a,b)=>b-a)}
function pAb(C,K){if(!S.live)return .5;const h=Math.max((C.b-Date.now())/36e5,.05);return Math.min(.995,Math.max(.005,Phi(Math.log(S.live/K)/(.012*Math.sqrt(h)))))}
const kf=K=>"$"+(+K.toFixed(3));
function ladQ(k,C){return k==="1H"?`IMD above ___ at ${hm(C.b)} UTC?`:k==="1M"?`IMD above ___ at the end of ${MONL[new Date(C.a).getUTCMonth()]}?`:`IMD above ___ on ${day(C.b)}, 00:00 UTC?`}
function ladCard(k){const C=mk(k,0),Ks=ladK(k),rows=Ks.map(K=>[K,pAb(C,K)]).sort((a,b)=>Math.abs(a[1]-.5)-Math.abs(b[1]-.5)).slice(0,3).sort((a,b)=>b[0]-a[0]);
 return `<div class="mc" onclick="location.hash='#/l/${k}'"><div class="t"><div class="ic">IMD</div><b>${ladQ(k,C)}<br><span style="color:var(--mut);font-weight:500;font-size:12px">${KN(k)[2]} · ends ${left(C.b)}</span></b></div>${rows.map(([K,q])=>`<div style="display:flex;align-items:center;gap:8px;font-size:14px"><b style="width:64px">${kf(K)}</b><span style="flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${q*100}%;background:var(--up)"></i></span><b style="width:44px;text-align:right">${pct(q)}</b><button class="sb" style="background:var(--upbg);color:var(--upt)" onclick="event.stopPropagation();S.lk=[${K},'YES'];location.hash='#/l/${k}'">Yes</button><button class="sb" style="background:var(--dnbg);color:var(--dnt)" onclick="event.stopPropagation();S.lk=[${K},'NO'];location.hash='#/l/${k}'">No</button></div>`).join("")}<div class="foot"><span class="lv">LIVE</span><span>· ${Ks.length} strikes</span><span style="margin-left:auto">${volT(api.ladderVolume(k))}</span></div></div>`}
function lgo(){if(innerWidth<900)setTimeout(()=>document.querySelector(".tp").scrollIntoView({behavior:"smooth"}),50)}
function ladder(k){side(k);const C=mk(k,0),v=V(),Ks=ladK(k);if(!S.lk||!Ks.includes(S.lk[0]))S.lk=[Ks.map(K=>[K,Math.abs(pAb(C,K)-.5)]).sort((a,b)=>a[1]-b[1])[0][0],S.lk?S.lk[1]:"YES"];
 const [LK,LS]=S.lk,q=pAb(C,LK),qs=LS==="YES"?q:1-q,pu=qs*v,cost=pu*S.sh,fee=.07*qs*(1-qs)*v*S.sh,win=S.sh*v;
 const rows=Ks.map(K=>{const qq=pAb(C,K);return `<tr${K===LK?' style="background:var(--panel2)"':""}><td><b style="font-size:16px">${kf(K)}</b></td><td style="width:40%"><span style="display:flex;align-items:center;gap:8px"><b style="width:46px">${pct(qq)}</b><span class="lbar" style="flex:1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${qq*100}%;background:var(--up)"></i></span></span></td><td class="r"><button class="sb" style="background:${K===LK&&LS==="YES"?"var(--up)":"var(--upbg)"};color:${K===LK&&LS==="YES"?"#fff":"var(--upt)"};padding:8px 12px" onclick="S.lk=[${K},'YES'];render();lgo()">Yes ${pct(qq)}</button> <button class="sb" style="background:${K===LK&&LS==="NO"?"var(--dn)":"var(--dnbg)"};color:${K===LK&&LS==="NO"?"#fff":"var(--dnt)"};padding:8px 12px" onclick="S.lk=[${K},'NO'];render();lgo()">No ${pct(1-qq)}</button></td></tr>`}).join("");
 document.getElementById("main").innerHTML=`<div class="mtabs">${K.map(x=>`<a class="${x[0]===k?"on":""}" href="#/l/${x[0]}">${x[1]}</a>`).join("")}</div><a class="back" href="#/">← All markets</a>
 <div class="mp"><div class="mleft"><div class="mh"><div class="ic">IMD</div><div><h1>${ladQ(k,C)}</h1><div class="small">${label(k,C.a,C.b)} · ends in ${left(C.b)}</div></div></div>
 <div class="pr"><div class="cur"><div class="l">Current Price</div><div class="v">${usdf(S.live)}</div></div></div>
 <div class="tl ltl" style="margin:12px 0">${K.map(x=>`<button class="${x[0]===k?"on":""}" onclick="location.hash='#/l/${x[0]}'">${x[1]}</button>`).join("")}</div>
 <div class="box tbw"><table><tr><th>Price at the end</th><th>Chance</th><th class="r">Buy</th></tr>${rows}</table></div>
 <div class="box"><h3>Rules</h3><div class="rules">Each line is its own market. <b>Yes</b> wins if the IMD price at <b>${hm(C.b)} UTC, ${day(C.b)}</b> is above that line, otherwise <b>No</b>. Same price source, book, fees and payout as Up/Down: a winning share pays <b>1 USDC + 1 IMD</b>. Yes trades in USDC, No in IMD. Any line with 3 significant digits can be opened: the first order creates it.</div></div></div>
 <div class="mright"><div class="tp"><div class="hd"><div class="ic">IMD</div><div><b>IMD above ${kf(LK)}</b><small style="color:${LS==="YES"?"var(--upt)":"var(--dnt)"}">Buy ${LS==="YES"?"Yes":"No"}</small></div></div>
 <div class="ou"><button class="u ${LS==="YES"?"on":""}" onclick="S.lk=[${LK},'YES'];render()">Yes ${pct(q)}</button><button class="d ${LS==="NO"?"on":""}" onclick="S.lk=[${LK},'NO'];render()">No ${pct(1-q)}</button></div>
 <div class="fr"><span class="lb">Shares</span><div class="stp"><input style="width:110px" value="${S.sh}" onchange="S.sh=Math.max(0,+this.value);setTimeout(render,50)"></div></div>
 <div class="tot"><div class="r"><span>Total</span><b class="blu">${LS==="YES"?cost.toFixed(2)+" USDC":(cost/(S.live||1)).toFixed(3)+" IMD"} <span class="small">≈ ${m2(cost)}</span></b></div><div class="r"><span>To win</span><b class="g">💵 ${S.sh} USDC + ${S.sh} IMD</b></div><div class="r" style="align-items:baseline"><span>Estimated payout</span><b class="g" style="font-size:26px">≈ ${m2(win)}</b></div><div class="r" style="align-items:baseline"><span>Profit if you win</span><b style="color:var(--upt);font-size:20px">+${m2(win-cost-fee)}</b></div><div class="r small"><span>Fee (taker)</span><span>${m2(fee)}</span></div></div>
 <button class="trade" onclick="tradeLad('${k}',${LK},${LS==="YES"?1:0},${pu})">Trade</button><div class="small" style="text-align:center;margin-top:8px">${api.demo?"Demo · nothing is sent":"You sign in your wallet · Ethereum mainnet"}</div></div></div></div>`}
async function loadLive(){try{S.live=await usd("latest")}catch(e){}}
async function loadHist(k){if(!k||S.hist[k]||!CONFIG.CHART_API)return;const tf={"1H":["minute",1,90],"1D":["minute",15,120],"1W":["hour",2,120],"1M":["hour",6,140]}[k];
 try{const r=await fetch(`${CONFIG.CHART_API}${POOL}/ohlcv/${tf[0]}?aggregate=${tf[1]}&limit=${tf[2]}&currency=usd`);const j=await r.json();S.hist[k]=j.data.attributes.ohlcv_list.map(c=>[c[0],c[4]]).sort((x,y)=>x[0]-y[0]);render()}catch(e){}}
async function priceAt(T,h,hT){if(S.bp[T])return;const N=await blockAt(Math.floor(T/1e3),h,hT),v=await Promise.all([0,1,2].map(i=>usd("0x"+(N+i).toString(16))));S.bp[T]={p:v.sort((x,y)=>x-y)[1],block:N};render()}
async function loadStrikes(){const{h,hT}=await PimdProof.head(),n=Date.now(),q=[];
 for(const k of ["1H","1D","1W","1M"])for(const o of [0,1,-1,-2,-3]){const[a]=slot(k,o);if(a<=n&&!q.includes(a))q.push(a)}
 const run=async()=>{while(q.length){const T=q.shift();try{await priceAt(T,h,hT)}catch(e){}}};await Promise.all([run(),run(),run()])}
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('pimd-theme',t);const b=document.getElementById('thm');if(b)b.textContent=t==='light'?'🌙':'☀️'}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light')}
setTheme(localStorage.getItem('pimd-theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
window.addEventListener("hashchange",()=>{S.lp=null;render();window.scrollTo(0,0)});
render();WALLET.restore();loadLive().then(render);loadStrikes().catch(()=>{});setInterval(()=>loadLive().then(render),15000);setInterval(render,1000);
</script></body></html>
